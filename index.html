<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links Úteis do PRM 11 - 001</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      color: #0f172a;
    }
    .fundo-imagem {
      position: fixed;
      inset: 0;
      z-index: -2;
      /* No GitHub Pages, prefira subir a imagem no repositório (ex.: url('fundo.png')),
         pois o link do Drive só carrega se o arquivo estiver compartilhado publicamente. */
      background-image: url('https://lh3.googleusercontent.com/d/10Cyvtv8sTQQ_WD8dQcOs9yRnWQ8wiz3y');
      background-size: 60%;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.8) contrast(0.9) brightness(1.05);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(241, 245, 249, 0.45);
    }
    @media (max-width: 1024px) {
      html, body {
        height: auto;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none box-border p-2">

  <div class="fundo-imagem"></div>

  <header class="py-2 px-4 bg-slate-950/85 text-white rounded-xl shadow-md border-b-4 border-blue-600 flex flex-col justify-center items-center shrink-0 mb-2 backdrop-blur-sm">
    <h1 class="text-lg sm:text-2xl font-black uppercase tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-200 to-blue-500 text-center">
      Links Úteis do PRM 11 - 001
    </h1>
    <p class="text-[10px] sm:text-xs tracking-widest text-slate-300 uppercase font-bold mt-0.5">
      Painel de Acesso Rápido • 11ª Região Militar
    </p>
  </header>

  <main class="flex-1 flex items-center justify-center overflow-hidden">
    <div id="grid-links" class="w-full max-w-5xl h-full max-h-[calc(100vh-110px)] grid grid-cols-4 grid-rows-4 gap-2 sm:gap-3">
      <div class="col-span-4 row-span-4 flex items-center justify-center text-slate-800 font-semibold animate-pulse text-sm bg-white/40 rounded-xl backdrop-blur-xs">
        Carregando links da planilha...
      </div>
    </div>
  </main>

  <script>
    // ============================================================
    // CONFIGURAÇÃO: cole aqui a URL do Web App (termina em /exec).
    // Só é usada fora do Apps Script (ex.: GitHub Pages).
    // Dentro do Apps Script, o google.script.run é usado automaticamente.
    // ============================================================
    const URL_API = "https://script.google.com/macros/s/AKfycbzQR-d6Q7sloUQC95NaY2p5SSEKWFpptUk1PtZ18aW3DTrOuLosBxflfcUFdcVohF_IZA/exec";

    const TOTAL_SLOTS = 16; // grid 4x4

    document.addEventListener("DOMContentLoaded", function () {
      const dentroDoAppsScript =
        typeof google !== "undefined" && google.script && google.script.run;

      if (dentroDoAppsScript) {
        // Execução dentro do Apps Script
        google.script.run
          .withSuccessHandler(renderizarLinks)
          .withFailureHandler(tratarErro)
          .obterLinksUteis();
      } else {
        // Execução externa (GitHub Pages): GET simples, sem cabeçalhos customizados
        if (URL_API.indexOf("COLE_AQUI") !== -1) {
          tratarErro(new Error("Configure a constante URL_API com a URL do Web App (/exec)."));
          return;
        }

        // Remove qualquer "?..." ou "#..." colado por engano na URL_API
        const urlBase = URL_API.split("?")[0].split("#")[0].trim();

        fetch(urlBase + "?modo=api_links")
          .then(function (resp) {
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            return resp.json();
          })
          .then(function (dados) {
            if (dados && dados.erro) throw new Error(dados.erro);
            renderizarLinks(dados);
          })
          .catch(tratarErro);
      }
    });

    // Aceita apenas URLs http(s) como destino de link
    function urlSegura(url) {
      return typeof url === "string" && /^https?:\/\//i.test(url.trim());
    }

    function renderizarLinks(matrizDados) {
      const container = document.getElementById("grid-links");
      container.innerHTML = "";

      const itensValidos = [];

      // Recolhe todos os elementos preenchidos da planilha independentemente da posição exata
      if (Array.isArray(matrizDados)) {
        matrizDados.forEach(function (linha) {
          linha.forEach(function (celula) {
            if (celula && celula.texto !== "") {
              itensValidos.push(celula);
            }
          });
        });
      }

      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const cardDiv = document.createElement("div");
        cardDiv.className =
          "flex items-center justify-center p-2 bg-white/75 hover:bg-white/95 border-2 border-blue-600/80 rounded-xl shadow-md transition-all duration-200 text-center relative overflow-hidden backdrop-blur-xs";

        if (i < itensValidos.length) {
          const item = itensValidos[i];

          if (urlSegura(item.link)) {
            // Link clicável (montado via DOM para evitar injeção de HTML)
            const a = document.createElement("a");
            a.href = item.link.trim();
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.className =
              "text-[11px] sm:text-xs md:text-sm font-bold text-blue-800 hover:text-blue-950 underline line-clamp-3 w-full h-full flex items-center justify-center p-1 leading-tight";
            a.textContent = item.texto;
            cardDiv.appendChild(a);
          } else {
            const span = document.createElement("span");
            span.className =
              "text-[11px] sm:text-xs md:text-sm font-bold text-slate-900 line-clamp-3 leading-tight";
            span.textContent = item.texto;
            cardDiv.appendChild(span);
          }
        } else {
          // Espaços vazios/reservados para o futuro
          cardDiv.className += " border-dashed border-slate-400 bg-white/30 opacity-60";
          const span = document.createElement("span");
          span.className = "text-[10px] sm:text-xs text-slate-600 font-medium italic";
          span.innerHTML = '<i class="fa-solid fa-plus mr-1"></i>Reservado';
          cardDiv.appendChild(span);
        }

        container.appendChild(cardDiv);
      }
    }

    function tratarErro(erro) {
      const container = document.getElementById("grid-links");
      container.innerHTML = "";

      const div = document.createElement("div");
      div.className =
        "col-span-4 row-span-4 flex items-center justify-center text-red-600 font-bold text-xs sm:text-sm bg-white/75 rounded-xl p-4 backdrop-blur-xs text-center";
      div.textContent = "Erro ao carregar os links: " + (erro && erro.message ? erro.message : erro);
      container.appendChild(div);
    }
  </script>
</body>
</html>
